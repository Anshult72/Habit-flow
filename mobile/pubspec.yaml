name: habitflow_mobile
description: "A new Flutter project for HabitFlow"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.4
  
  # Routing
  go_router: ^13.1.0

  # Networking
  dio: ^5.4.0
  
  # Authentication & Storage
  supabase_flutter: ^2.3.1
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # UI / UX / Animations
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  cupertino_icons: ^1.0.6
  timeago: ^3.7.1
  confetti: ^0.8.0
  fl_chart: ^1.2.0
  connectivity_plus: ^7.1.1
  lucide_icons_flutter: ^3.1.14
  image_picker: ^1.2.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  
  # App Icon Generator
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
